  <rect class="node" x="500" y="470" width="200" height="110" rx="10"/>
  <text class="name" x="520" y="504">Backup timer</text>
  <text class="detail" x="520" y="533">systemd · daily</text>
  <text class="caption" x="520" y="561">Validated · keeps 14</text>
</svg>
